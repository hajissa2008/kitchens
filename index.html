<title>4D Kitchen Studio</title>

<style>
/* Layout: full-bleed 3D stage; translucent top bar + floating segmented dock; sheets materialise from the dock. Apple-style: system type, glass materials, critically damped springs. */
:root{
  --stage:#e8e8eb; --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.88); --edge:rgba(255,255,255,.65); --hair:rgba(0,0,0,.08);
  --fg:#1d1d1f; --fg-2:#6e6e73; --fg-3:#8e8e93; --tint:#0a6cff; --tint-soft:rgba(10,108,255,.12); --on-tint:#fff; --pill:#1d1d1f; --on-pill:#f5f5f7;
  --shadow:0 10px 30px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.06);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --f-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --stage:#111113; --glass:rgba(36,36,40,.66); --glass-strong:rgba(44,44,48,.86); --edge:rgba(255,255,255,.10); --hair:rgba(255,255,255,.10);
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#7c7c80; --tint:#3d8bff; --tint-soft:rgba(61,139,255,.20); --pill:#f5f5f7; --on-pill:#1d1d1f;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#111113; --glass:rgba(36,36,40,.66); --glass-strong:rgba(44,44,48,.86); --edge:rgba(255,255,255,.10); --hair:rgba(255,255,255,.10);
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#7c7c80; --tint:#3d8bff; --tint-soft:rgba(61,139,255,.20); --pill:#f5f5f7; --on-pill:#1d1d1f;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--stage);color:var(--fg);font-family:var(--f);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;outline:none}
.mat{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--edge);box-shadow:var(--shadow)}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.brand{pointer-events:auto;border-radius:16px;padding:9px 14px;min-width:0}
.brand h1{margin:0;font:600 17px/1.15 var(--f-d);letter-spacing:-.022em;text-wrap:balance}
.brand h1{white-space:nowrap}
.brand{flex:0 1 auto;overflow:hidden}
.brand p{margin:2px 0 0;font:400 12px/1.3 var(--f);color:var(--fg-2);letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{pointer-events:auto;border-radius:999px;padding:8px 13px;font:500 12px/1 var(--f);letter-spacing:-.005em;white-space:nowrap;color:var(--fg);font-variant-numeric:tabular-nums;max-width:36vw;overflow:hidden;text-overflow:ellipsis}
.chip b{font-weight:600}
.tr{display:flex;gap:6px;align-items:center;min-width:0}
.snd{all:unset;pointer-events:auto;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--fg);flex:none;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--edge);box-shadow:var(--shadow);transition:transform 120ms}
.snd:active{transform:scale(.92)}
.snd:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.snd svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.snd .m{display:none}.snd.off .m{display:inline}.snd.off .w{display:none}.snd.off{color:var(--fg-3)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:2px;border-radius:22px;padding:5px;z-index:6;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;transition:opacity .3s}
.dock::-webkit-scrollbar{display:none}
.dock button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 6px 6px;border-radius:17px;color:var(--fg-2);font:500 10px/1 var(--f);letter-spacing:.01em;min-width:42px;transition:transform 120ms ease-out,background-color 200ms,color 200ms}
.dock button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dock button:active{transform:scale(.94)}
.dock button.on{background:var(--tint-soft);color:var(--tint)}
.dock button:focus-visible{outline:2px solid var(--tint);outline-offset:1px}
.sheet{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 88px);margin:0 auto;max-width:540px;border-radius:22px;padding:16px 18px 18px;z-index:6;background:var(--glass-strong);transform-origin:50% 120%;max-height:calc(100dvh - 200px);overflow-y:auto;overscroll-behavior:contain;animation:materialize 320ms cubic-bezier(.2,.9,.25,1)}
@keyframes materialize{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.sheet h2{margin:2px 0 0;font:600 19px/1.2 var(--f-d);letter-spacing:-.02em;padding-right:30px}
.sheet .eyebrow{font:600 11px/1.2 var(--f);letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3)}
.sheet p{margin:8px 0 0;font:400 14px/1.45 var(--f);color:var(--fg-2);letter-spacing:-.006em}
.x{all:unset;cursor:pointer;position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--hair);color:var(--fg-2);font:500 13px/1 var(--f)}
.x:active{transform:scale(.92)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;font-size:13px}
.spec dt{color:var(--fg-3)} .spec dd{margin:0;font-variant-numeric:tabular-nums}
.btn{all:unset;cursor:pointer;margin-top:14px;display:inline-flex;align-items:center;justify-content:center;background:var(--tint);color:var(--on-tint);font:600 14px/1 var(--f);padding:11px 18px;border-radius:12px;letter-spacing:-.01em;transition:transform 120ms ease-out}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--hair);color:var(--fg)}
.btn[disabled]{opacity:.4;cursor:default}
.btn:focus-visible,.seg button:focus-visible,.opt:focus-visible,.play:focus-visible,.x:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tl-row{display:flex;align-items:center;gap:12px;margin-top:12px}
.tl-row input[type=range]{flex:1;accent-color:var(--tint);min-width:0}
.play{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;background:var(--tint);display:grid;place-items:center;color:var(--on-tint);flex:none;transition:transform 120ms}
.play:active{transform:scale(.94)}
.play svg{width:13px;height:13px;fill:currentColor}
.gantt{margin-top:12px;display:grid;gap:5px}
.gbar{display:grid;grid-template-columns:minmax(0,148px) 1fr;align-items:center;gap:10px;font-size:12px;color:var(--fg-3)}
.gbar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtrack{height:6px;background:var(--hair);border-radius:3px;position:relative}
.gfill{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--fg-3);opacity:.45}
.gbar.done{color:var(--fg)} .gbar.done .gfill{background:var(--tint);opacity:1}
.gbar.now{color:var(--tint);font-weight:600} .gbar.now .gfill{background:var(--tint);opacity:.6}
.seg{display:flex;background:var(--hair);border-radius:11px;padding:2px;margin-top:12px;gap:2px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:8px 6px;border-radius:9px;font:500 12.5px/1.1 var(--f);color:var(--fg-2)}
.seg button.on{background:var(--glass-strong);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.brow{display:grid;grid-template-columns:88px minmax(0,1fr);align-items:center;gap:10px;margin-top:8px;font:500 13px/1.2 var(--f)}
.brow .seg{margin-top:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{all:unset;cursor:pointer;border:1px solid var(--hair);border-radius:14px;padding:10px 12px;font:500 13px/1.2 var(--f);display:flex;align-items:center;gap:9px;transition:transform 120ms;min-width:0}
.opt:active{transform:scale(.97)}
.opt.on{border-color:var(--tint);box-shadow:0 0 0 1px var(--tint) inset}
.tray{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);margin:0 auto;max-width:560px;border-radius:22px;padding:10px 0 12px;z-index:6;background:var(--glass-strong);transform-origin:50% 120%;animation:materialize 320ms cubic-bezier(.2,.9,.25,1)}
.tray-head{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px}
.tray .seg{margin:0;flex:1;min-width:0}
.tray .x{position:static;flex:none}
.tray-cap{padding:8px 16px 0;font:500 13px/1.2 var(--f);color:var(--fg);letter-spacing:-.01em;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray-cap small{color:var(--fg-3);font-weight:400}
.rail{display:flex;gap:10px;overflow-x:auto;padding:10px 16px 2px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.opt2{all:unset;cursor:pointer;flex:none;scroll-snap-align:start;display:grid;justify-items:center;align-content:start;gap:6px;width:76px;font:500 11px/1.2 var(--f);color:var(--fg-2);text-align:center;transition:transform 120ms}
.opt2:active{transform:scale(.95)}
.opt2 .dot{width:50px;height:50px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);outline:2px solid transparent;outline-offset:2px}
.opt2 img{width:76px;height:50px;border-radius:12px;object-fit:cover;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);outline:2px solid transparent;outline-offset:2px;display:block}
.opt2.on{color:var(--fg)} .opt2.on .dot,.opt2.on img{outline-color:var(--tint)}
.opt2:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:12px}
.pill{all:unset;cursor:pointer;flex:none;scroll-snap-align:start;padding:10px 14px;border-radius:999px;background:var(--hair);font:500 13px/1 var(--f);color:var(--fg);white-space:nowrap;transition:transform 120ms}
.pill:active{transform:scale(.96)} .pill.on{background:var(--tint);color:var(--on-tint)}
.pill:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.stones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stone{all:unset;cursor:pointer;display:grid;gap:5px;font:500 11.5px/1.2 var(--f);color:var(--fg);min-width:0;transition:transform 120ms}
.stone:active{transform:scale(.96)}
.stone img{width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);outline:2px solid transparent;outline-offset:1px}
.stone.on img{outline-color:var(--tint)}
.stone span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stone small{color:var(--fg-3);font-size:10.5px}
.stone:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:10px}
.sw{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.lbl{position:fixed;left:0;top:0;transform:translate(-50%,-50%);font:600 11px/1 var(--f);color:var(--on-pill);background:var(--pill);padding:4px 7px;border-radius:999px;pointer-events:none;white-space:nowrap;z-index:3;font-variant-numeric:tabular-nums;opacity:.88}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);border-radius:999px;padding:7px 14px;font:500 12.5px/1.2 var(--f);color:var(--fg);z-index:4;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;transition:opacity .5s}
#joy{position:fixed;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 100px);width:112px;height:112px;border-radius:50%;z-index:5;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--glass-strong);box-shadow:var(--shadow)}
.copy{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 2px);font:400 9.5px var(--f);color:var(--fg-3);z-index:4;pointer-events:none;opacity:.8}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--stage);z-index:20;font:500 13px var(--f);color:var(--fg-2);transition:opacity .5s}
@media (min-width:760px){.sheet{left:auto;right:max(16px,env(safe-area-inset-right,0px));bottom:auto;top:calc(env(safe-area-inset-top,0px) + 70px);width:360px;margin:0;transform-origin:100% 0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.hint,#load{transition:none}.dock button,.btn,.opt,.play{transition:none}}
@media (prefers-reduced-transparency:reduce){.mat,.sheet{background:var(--glass-strong);backdrop-filter:none;-webkit-backdrop-filter:none}}
</style>

</head>
<body>
<div id="stage"></div>
<div id="load">Preparing kitchen…</div>

<div class="top">
  <div class="brand mat"><h1>4D Kitchen Studio</h1><p>500 × 400 · H 297 cm</p></div>
  <div class="tr"><button class="snd mat" id="bSnd" aria-label="Sound on" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="m" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  <div class="chip mat" id="dayChip"><b>Day 17</b> of 17 · Complete</div></div>
</div>
<div class="hint mat" id="hint">Tap any door, drawer or appliance</div>

<div class="sheet mat" id="sheet" hidden>
  <button class="x" id="sheetX" aria-label="Close">✕</button>
  <div id="sheetBody"></div>
</div>

<div class="tray mat" id="tray" hidden role="region" aria-label="Finishes">
  <div class="tray-head">
    <div class="seg" role="tablist" aria-label="Finish category"><button data-tab="cab" class="on" role="tab">Cabinets</button><button data-tab="stone" role="tab">Countertop</button><button data-tab="light" role="tab">Settings</button></div>
    <button class="x" id="trayX" aria-label="Close finishes">✕</button>
  </div>
  <div class="tray-cap" id="trayCap"></div>
  <div class="rail" id="rail"></div>
</div>

<div id="joy" class="mat" hidden><i></i></div>

<nav class="dock mat" aria-label="View modes">
  <button id="bOrbit" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><ellipse cx="12" cy="12" rx="9.5" ry="4"/></svg>Orbit</button>
  <button id="bWalk"><svg viewBox="0 0 24 24"><circle cx="13" cy="4.2" r="1.9"/><path d="M10 21l2-6 3 3v3M7 12l3-4h4l2 4M12 15l-1-5"/></svg>Walk</button>
  <button id="bTour"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>Tour</button>
  <button id="bPlan"><svg viewBox="0 0 24 24"><path d="M7 3h14v18H3V10h4zM7 3v7M3 10h4M12 21v-6h9"/></svg>Plan</button>
  <button id="b4d"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7 14h5M7 17h8"/></svg>4D</button>
  <button id="bVR"><svg viewBox="0 0 24 24"><path d="M3.5 8.5h17a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-5l-2-2.5h-3l-2 2.5h-5a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z"/></svg>VR</button>
  <button id="bMore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M12 3.5a8.5 8.5 0 0 0 0 17"/></svg>Finish</button>
</nav>
